<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open Brain · 人工模型控制台</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1e232d;
      --line: #2c3340;
      --text: #e8ecf3;
      --muted: #8b95a7;
      --accent: #7c9cff;
      --ok: #3dd68c;
      --warn: #f5c542;
      --bad: #ff6b7a;
      --user: #7c9cff;
      --assistant: #3dd68c;
      --system: #f5c542;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
    body { display: grid; grid-template-columns: 320px 1fr; }
    aside, main { min-height: 100vh; }
    aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; }
    header.brand { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
    header.brand h1 { margin: 0; font-size: 16px; letter-spacing: .02em; }
    header.brand p { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
    .status { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); margin-top: 4px; flex: 0 0 auto; }
    .dot.live { background: var(--ok); }
    .jobs { overflow: auto; flex: 1; }
    .job { padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
    .job:hover { background: var(--panel-2); }
    .job.active { background: #24304a; }
    .job .meta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 11px; }
    .job .preview { margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { font-size: 10px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line); text-transform: uppercase; }
    .badge.pending { color: var(--warn); border-color: #6b5420; }
    .badge.completed { color: var(--ok); border-color: #1f6b46; }
    .badge.rejected, .badge.expired, .badge.cancelled { color: var(--bad); border-color: #6b2a32; }
    main { display: grid; grid-template-rows: auto 1fr auto; }
    .empty { display: grid; place-items: center; color: var(--muted); }
    .thread { overflow: auto; padding: 20px 24px; }
    .msg { max-width: 760px; margin: 0 auto 14px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
    .msg .role { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
    .msg.user { border-left: 3px solid var(--user); }
    .msg.assistant { border-left: 3px solid var(--assistant); }
    .msg.system, .msg.tool, .msg.developer { border-left: 3px solid var(--system); }
    .msg pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: inherit; }
    .composer { border-top: 1px solid var(--line); padding: 14px 20px 18px; background: var(--panel); }
    textarea { width: 100%; min-height: 120px; resize: vertical; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: inherit; }
    textarea:focus { outline: 1px solid var(--accent); }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    button { background: var(--accent); color: #0b1020; border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 650; cursor: pointer; }
    button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
    button.danger { background: #4a1e24; color: #ffb4bc; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .hint { color: var(--muted); font-size: 12px; margin-left: auto; }
    .payload { max-width: 760px; margin: 0 auto 16px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <aside>
    <header class="brand">
      <h1>Open Brain</h1>
      <p>你就是模型。客户端走 OpenAI 协议，这里人工回复。</p>
    </header>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="conn">连接中…</span>
    </div>
    <div class="jobs" id="jobs"></div>
  </aside>
  <main>
    <div class="empty" id="empty">等待客户端请求…</div>
    <div class="thread" id="thread" hidden></div>
    <div class="composer" id="composer" hidden>
      <textarea id="reply" placeholder="以助手身份回复…"></textarea>
      <div class="row">
        <button id="send">发送回复</button>
        <button class="danger" id="reject">拒绝</button>
        <span class="hint">Ctrl+Enter 发送 · 流式请求会按字块推给客户端</span>
      </div>
    </div>
  </main>
  <script>
    const jobsEl = document.getElementById("jobs");
    const threadEl = document.getElementById("thread");
    const emptyEl = document.getElementById("empty");
    const composerEl = document.getElementById("composer");
    const replyEl = document.getElementById("reply");
    const sendEl = document.getElementById("send");
    const rejectEl = document.getElementById("reject");
    const connEl = document.getElementById("conn");
    const dotEl = document.getElementById("dot");

    let jobs = [];
    let selected = null;
    let ws;

    function lastUserText(job) {
      const msgs = job.messages || [];
      for (let i = msgs.length - 1; i >= 0; i--) {
        if (msgs[i].role === "user") return textOf(msgs[i].content) || "(空消息)";
      }
      return job.prompt || "(无内容)";
    }

    function textOf(content) {
      if (content == null) return "";
      if (typeof content === "string") return content;
      if (Array.isArray(content)) {
        return content.map((p) => {
          if (typeof p === "string") return p;
          if (p && p.type === "text") return p.text || "";
          return JSON.stringify(p);
        }).join("\n");
      }
      return JSON.stringify(content);
    }

    function renderJobs() {
      jobsEl.innerHTML = jobs.map((j) => `
        <div class="job ${selected === j.id ? "active" : ""}" data-id="${j.id}">
          <div class="meta">
            <span>${j.kind} · ${j.model}${j.stream ? " · stream" : ""}</span>
            <span class="badge ${j.status}">${j.status}</span>
          </div>
          <div class="preview">${escapeHtml(lastUserText(j))}</div>
        </div>
      `).join("") || `<div class="job"><div class="preview" style="color:var(--muted)">暂无任务</div></div>`;
    }

    function renderThread(job) {
      if (!job) {
        emptyEl.hidden = false;
        threadEl.hidden = true;
        composerEl.hidden = true;
        return;
      }
      emptyEl.hidden = true;
      threadEl.hidden = false;
      composerEl.hidden = job.status !== "pending";
      sendEl.disabled = job.status !== "pending";
      rejectEl.disabled = job.status !== "pending";
      const extra = [];
      if (job.payload && job.payload.tools) extra.push("tools: " + JSON.stringify(job.payload.tools));
      if (job.payload && job.payload.response_format) extra.push("response_format: " + JSON.stringify(job.payload.response_format));
      const msgs = (job.messages || []).map((m) => `
        <div class="msg ${escapeHtml(m.role || "user")}">
          <div class="role">${escapeHtml(m.role || "user")}${m.name ? " · " + escapeHtml(m.name) : ""}</div>
          <pre>${escapeHtml(textOf(m.content) || (m.tool_calls ? JSON.stringify(m.tool_calls, null, 2) : ""))}</pre>
        </div>
      `).join("");
      threadEl.innerHTML = `
        <div class="payload">${escapeHtml(job.id)} · created ${new Date(job.created * 1000).toLocaleString()}${extra.length ? "<br>" + extra.map(escapeHtml).join("<br>") : ""}</div>
        ${msgs}
        ${job.reply ? `<div class="msg assistant"><div class="role">assistant (已回复)</div><pre>${escapeHtml(job.reply)}</pre></div>` : ""}
        ${job.error ? `<div class="msg system"><div class="role">error</div><pre>${escapeHtml(job.error)}</pre></div>` : ""}
      `;
      threadEl.scrollTop = threadEl.scrollHeight;
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function upsert(job) {
      const i = jobs.findIndex((j) => j.id === job.id);
      if (i >= 0) jobs[i] = job;
      else jobs.unshift(job);
      jobs.sort((a, b) => {
        const rank = (s) => s === "pending" ? 0 : 1;
        const d = rank(a.status) - rank(b.status);
        return d !== 0 ? d : b.created - a.created;
      });
      if (!selected && job.status === "pending") selected = job.id;
      renderJobs();
      if (selected === job.id) renderThread(job);
    }

    async function load() {
      const res = await fetch("/operator/jobs");
      const data = await res.json();
      jobs = data.jobs || [];
      if (!selected) {
        const first = jobs.find((j) => j.status === "pending") || jobs[0];
        selected = first ? first.id : null;
      }
      renderJobs();
      renderThread(jobs.find((j) => j.id === selected));
    }

    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/operator/ws`);
      ws.onopen = () => { connEl.textContent = "实时连接"; dotEl.classList.add("live"); };
      ws.onclose = () => {
        connEl.textContent = "已断开，3s 后重连";
        dotEl.classList.remove("live");
        setTimeout(connect, 3000);
      };
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.job) upsert(msg.job);
      };
    }

    jobsEl.addEventListener("click", (e) => {
      const node = e.target.closest(".job");
      if (!node || !node.dataset.id) return;
      selected = node.dataset.id;
      renderJobs();
      renderThread(jobs.find((j) => j.id === selected));
      replyEl.focus();
    });

    async function sendReply() {
      const job = jobs.find((j) => j.id === selected);
      if (!job || job.status !== "pending") return;
      const content = replyEl.value;
      const res = await fetch(`/operator/jobs/${job.id}/reply`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ content }),
      });
      if (!res.ok) {
        alert(await res.text());
        return;
      }
      replyEl.value = "";
    }

    async function rejectJob() {
      const job = jobs.find((j) => j.id === selected);
      if (!job || job.status !== "pending") return;
      const message = prompt("拒绝原因", "operator rejected the request") || "operator rejected the request";
      await fetch(`/operator/jobs/${job.id}/reject`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ message }),
      });
    }

    sendEl.addEventListener("click", sendReply);
    rejectEl.addEventListener("click", rejectJob);
    replyEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        sendReply();
      }
    });

    load();
    connect();
  </script>
</body>
</html>
