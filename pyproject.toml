[project]
name = "open-brain"
version = "0.1.0"
description = "OpenAI-compatible API served by a human operator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0", "pytest>=8.0.0"]

[project.scripts]
open-brain = "open_brain.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["open_brain*"]

[tool.setuptools.package-data]
open_brain = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
